name: PR actions

on:
  issue_comment:
    types: [created, edited]
  
jobs: 
  build:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/publish') && github.event.comment.user.login != 'coderabbitai[bot]'
    name: Build PR packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      comment-id: ${{ steps.pr-comment.outputs.comment-id }}
    steps:
      - name: Check if comment author is a contributor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          comment_author="${{ github.event.comment.user.login }}"

          # Check if user has write access using a different approach
          permission=$(gh api repos/${{ github.repository }}/collaborators/$comment_author/permission 2>/dev/null | jq -r '.permission // "none"')
          if [[ "$permission" == "admin" || "$permission" == "write" ]]; then
            echo "Comment author ($comment_author) has $permission access, continuing"
          else
            echo "Comment author ($comment_author) has $permission access, skipping job"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 0

      - name: Build PR release version
        id: build-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefOid | jq -r '.headRefOid' | cut -c1-8)
          branch=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName | jq -r '.headRefName' | sed 's/.*\///')
          version=$(git describe --abbrev=0 --tags 2>/dev/null)
          version=$(echo $version | cut -d '-' -f 2)
          version="$version-pr.${{ github.run_number }}.$branch.$sha"
          version=$(echo $version | sed 's/^v//')
          echo "MINVERVERSIONOVERRIDE=$version" >> $GITHUB_ENV
          echo "PR_RELEASE_VERSION=$version" >> $GITHUB_OUTPUT
          echo $version

      - name: Create PR comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        id: pr-comment
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ## PR release:

            * [Altinn.Platform.Storage.Interface ${{ steps.build-version.outputs.PR_RELEASE_VERSION }}](https://www.nuget.org/packages/Altinn.Platform.Storage.Interface.Experimental/${{ steps.build-version.outputs.PR_RELEASE_VERSION }})

            > ⚙️ Building...

      - name: Install deps
        run: |
          cd src/Storage.Interface
          dotnet restore
      - name: Build
        run: |
          cd src/Storage.Interface
          dotnet build --configuration Release --no-restore -p:Deterministic=true -p:BuildNumber=${{ github.run_number }}
      - name: Pack PR release
        run: |
          cd src/Storage.Interface
          dotnet pack --configuration Release --no-restore --no-build -p:BuildNumber=${{ github.run_number }} -p:Deterministic=true
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            src/Storage.Interface/bin/Release/*.nupkg
            src/Storage.Interface/bin/Release/*.snupkg
          if-no-files-found: error
          retention-days: 1

      - name: Update PR comment - failure
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        if: failure()
        with:
          issue-number: ${{ github.event.issue.number }}
          comment-id: ${{ steps.pr-comment.outputs.comment-id }}
          edit-mode: append
          body: |
            > ❌ Failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Kept separate from the build job so that PR code never runs in a job that can mint a NuGet API key
  publish:
    name: Publish PR packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}

      - name: Publish PR release
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Update PR comment - failure
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        if: failure()
        with:
          issue-number: ${{ github.event.issue.number }}
          comment-id: ${{ needs.build.outputs.comment-id }}
          edit-mode: append
          body: |
            > ❌ Failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Update PR comment - success
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        if: success()
        with:
          issue-number: ${{ github.event.issue.number }}
          comment-id: ${{ needs.build.outputs.comment-id }}
          edit-mode: append
          body: |
            > ✅ Done!
          reactions: rocket
